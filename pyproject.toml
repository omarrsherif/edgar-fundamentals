[project]
name = "edgar-fundamentals"
version = "0.1.0"
description = "Production-shaped fundamentals data platform over the SEC Financial Statement Data Sets (DuckDB + Streamlit)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "pyyaml>=6.0",
    "streamlit>=1.50",
    "plotly>=5.24",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "playwright>=1.47"]

[project.scripts]
edgar-fundamentals = "edgar_fundamentals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_fundamentals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a built warehouse in data/"]
addopts = "-q"

[tool.coverage.run]
source = ["edgar_fundamentals"]
omit = ["*/dashboard/app.py"]
