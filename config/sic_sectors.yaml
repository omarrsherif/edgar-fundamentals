# Standard Industrial Classification -> sector (division) and industry (2-digit major group).
# Source: SEC "Division of Corporation Finance: Standard Industrial Classification (SIC) Code List".
divisions:
  - {code: A, name: "Agriculture, Forestry & Fishing", from: 100, to: 999}
  - {code: B, name: "Mining", from: 1000, to: 1499}
  - {code: C, name: "Construction", from: 1500, to: 1799}
  - {code: D, name: "Manufacturing", from: 2000, to: 3999}
  - {code: E, name: "Transportation, Communications & Utilities", from: 4000, to: 4999}
  - {code: F, name: "Wholesale Trade", from: 5000, to: 5199}
  - {code: G, name: "Retail Trade", from: 5200, to: 5999}
  - {code: H, name: "Finance, Insurance & Real Estate", from: 6000, to: 6799}
  - {code: I, name: "Services", from: 7000, to: 8999}
  - {code: J, name: "Public Administration", from: 9100, to: 9999}

